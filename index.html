<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Scratchpad</title>
    <link rel="stylesheet" href="/node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="toolbar">
      <div class="toolbar-left">
        <select id="lang-select">
          <option value="python">Python</option>
          <option value="c">C</option>
          <option value="java">Java</option>
        </select>
        <button id="btn-run" class="btn primary">▶ Run (Ctrl+Enter)</button>
        <button
          id="btn-clear"
          class="btn secondary"
          title="Clear Terminal Output"
        >
          ⊘ Clear
        </button>
      </div>

      <div class="toolbar-right">
        <label class="toggle-label">
          <input type="checkbox" id="check-vim" />
          <span>Vim Mode</span>
        </label>
        <button
          id="btn-toggle-layout"
          class="btn secondary"
          title="Toggle Layout"
        >
          ◫ Toggle Layout
        </button>
        <button
          id="btn-toggle-terminal"
          class="btn secondary"
          title="Toggle Terminal"
        >
          ▤ Terminal
        </button>
      </div>
    </header>

    <main id="workspace" class="layout-horizontal">
      <section id="editor-container"></section>
      <div id="divider"></div>
      <section id="terminal-container"></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
